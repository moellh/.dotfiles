# Upscaler switching
ctrl+0 change-list glsl-shaders clr ""; show-text "Upscaler: off"
ctrl+1 change-list glsl-shaders set "~~/shaders/FSR.glsl"; show-text "Upscaler: FSR"
ctrl+2 change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "Upscaler: FSRCNNX"
ctrl+3 change-list glsl-shaders set "~~/shaders/ArtCNN_C4F16_DS.glsl"; show-text "Upscaler: ArtCNN (sharpen)"
ctrl+4 change-list glsl-shaders set "~~/shaders/nlmeans_light_sharpen_denoise.glsl:~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "Upscaler: Denoise+sharpen → FSRCNNX"
ctrl+5 change-list glsl-shaders set "~~/shaders/gaussblur.glsl:~~/shaders/CAS.glsl:~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"; show-text "Upscaler: Blur → CAS → FSRCNNX"
# Debanding (helps smooth color steps in dark scenes)
ctrl+d cycle deband; show-text "Deband: ${deband}"
