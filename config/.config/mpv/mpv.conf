# Better default scaling quality
profile=high-quality
vo=gpu-next
hwdec=auto-safe
# Render on the GTX 1050 (the external monitor is wired to it)
vulkan-device="NVIDIA GeForce GTX 1050"

# Default: light denoise+sharpen (nlmeans) at 720p, then FSRCNNX upscale. Switch live with Ctrl+0..5
glsl-shaders="~~/shaders/nlmeans_light_sharpen_denoise.glsl:~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

fullscreen=yes
