# Transparent lock screen (SUPER + ALT + L via lock-transparent.sh). Relies on Hyprland's
# misc:session_lock_xray so the desktop keeps rendering below the fully transparent lock surface.

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 0)
}

# Full-screen dim layer: an input field covering the whole monitor with invisible dots, shown only while the
# password buffer is non-empty and faded out again after fade_timeout once it is cleared (Escape, failed attempt).
input-field {
    monitor =
    size = 100%, 100%
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 0
    rounding = 0
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(0, 0, 0, 0)
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
    placeholder_text =
    fail_text =

    fade_on_empty = true
    fade_timeout = 4000

    zindex = 0
}

# Visible password prompt in the middle, fading in and out together with the dim layer.
input-field {
    monitor =
    size = 400, 56
    position = 0, 0
    halign = center
    valign = center

    dots_size = 0.3
    dots_spacing = 0.4
    dots_rounding = -1

    outline_thickness = 2
    rounding = -1
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(15, 15, 25, 0.75)
    font_color = rgb(255, 255, 255)
    placeholder_text =
    check_color = rgba(120, 170, 255, 0.8)
    fail_color = rgba(255, 90, 90, 0.9)
    fail_text = $FAIL ($ATTEMPTS)
    fail_timeout = 2000

    capslock_color = rgba(255, 0, 0, 200)
    numlock_color = rgba(0, 0, 255, 200)
    bothlock_color = rgba(255, 0, 255, 200)

    fade_on_empty = true
    fade_timeout = 4000

    zindex = 1
}
